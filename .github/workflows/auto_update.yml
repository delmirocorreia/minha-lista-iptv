name: Atualizar Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # Roda a cada 6 horas
  workflow_dispatch:      # Permite rodar manualmente no botão

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: |
          pip install undetected-chromedriver selenium requests

      - name: Rodar script
        run: python verificador.py # Certifique-se que o nome do seu arquivo é esse mesmo

      - name: Commit e Push das mudanças
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Canais200526.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Playlist atualizada automaticamente" && git push)
