name: Atualizar Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependências
        run: |
          pip install undetected-chromedriver selenium requests PyGithub chromedriver-autoinstaller

      - name: Rodar script
        env:
          MEU_TOKEN_GITHUB: ${{ secrets.MEU_TOKEN_GITHUB }}
        run: python verificador.py
