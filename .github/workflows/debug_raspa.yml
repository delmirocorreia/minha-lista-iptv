name: HTML RASPAGEM

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Playwright e Dependências
        run: |
          pip install playwright PyGithub
          playwright install chromium
          playwright install-deps

      - name: Rodar script
        env:
          MEU_TOKEN_GITHUB: ${{ secrets.MEU_TOKEN_GITHUB }}
        run: python espelho_raspa.py

      - name: Upload Debug Artifacts
        if: always() # Garante o upload mesmo que o script falhe
        uses: actions/upload-artifact@v4
        with:
          name: debug-results
          path: |
            debug_espelho.txt
            debug_visual.png
