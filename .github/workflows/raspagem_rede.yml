name: Executar Raspagem2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install undetected-chromedriver selenium selenium-wire requests PyGithub
          pip uninstall -y chromedriver-autoinstaller

      - name: Rodar script de raspagem
        env:
          MEU_TOKEN_GITHUB: ${{ secrets.MEU_TOKEN_GITHUB }}
        run: python espelho_raspa_rede.py
